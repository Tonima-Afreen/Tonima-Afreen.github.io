          rel="stylesheet">


<style>


/* ==========================================
   BASIC SETTINGS
========================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;
}


body {

    font-family: "Montserrat", sans-serif;

    background:
        radial-gradient(
            circle at top,
            #f7f9fc 0%,
            #e8eef5 45%,
            #d7e1ed 100%
        );

    color: #555d68;
}



/* ==========================================
   ENVELOPE SCREEN
========================================== */

#envelope-screen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 25px;

    background:
        radial-gradient(
            circle at top,
            #fafcff 0%,
            #edf3f8 45%,
            #d8e3ed 100%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}


#envelope-screen.hide {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


.envelope-title {

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(20px, 3vw, 28px);

    font-weight: 500;

    letter-spacing: 4px;

    text-align: center;

    color: #667487;

    margin-bottom: 35px;
}



/* ==========================================
   ENVELOPE
========================================== */

.envelope-wrapper {

    width:
        min(500px, 88vw);

    aspect-ratio:
        1.55 / 1;

    position: relative;

    cursor: pointer;

    filter:
        drop-shadow(
            0 20px 25px
            rgba(62, 79, 100, .20)
        );

    transition:
        transform .35s ease;
}


.envelope-wrapper:hover {

    transform:
        translateY(-5px);
}


.envelope {

    position: absolute;

    inset: 0;

    perspective: 1200px;
}



/* Envelope back */

.envelope-back {

    position: absolute;

    inset: 0;

    border-radius: 5px;

    background:
        linear-gradient(
            135deg,
            #d9e5f0,
            #aec4d9
        );
}



/* Invitation paper */

.letter-preview {

    position: absolute;

    width: 86%;
    height: 82%;

    left: 7%;
    top: 8%;

    background: #ffffff;

    border-radius: 4px;

    display: flex;

    justify-content: center;
    align-items: center;

    font-family:
        "Allura",
        cursive;

    font-size:
        clamp(35px, 7vw, 60px);

    color: #647487;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.12);

    transition:
        transform .8s ease .35s;
}



/* Left envelope fold */

.envelope-left {

    position: absolute;

    inset: 0;

    clip-path:
        polygon(
            0 0,
            52% 50%,
            0 100%
        );

    background:
        #c6d7e5;
}



/* Right envelope fold */

.envelope-right {

    position: absolute;

    inset: 0;

    clip-path:
        polygon(
            100% 0,
            48% 50%,
            100% 100%
        );

    background:
        #b7cddd;
}



/* Bottom envelope fold */

.envelope-bottom {

    position: absolute;

    inset: 0;

    clip-path:
        polygon(
            0 100%,
            50% 45%,
            100% 100%
        );

    background:
        linear-gradient(
            to top,
            #d6e2ec,
            #bfd1df
        );
}



/* Top flap */

.envelope-flap {

    position: absolute;

    width: 100%;
    height: 56%;

    top: 0;
    left: 0;

    background:
        linear-gradient(
            145deg,
            #dfe9f2,
            #b5cadd
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:
        top;

    transition:
        transform .8s ease;

    z-index: 10;
}



/* ==========================================
   WAX SEAL
========================================== */

.seal {

    position: absolute;

    width: 76px;
    height: 76px;

    left: 50%;
    top: 47%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    z-index: 20;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f4e3b2,
            #c9a85d 55%,
            #9d7d3d
        );

    color: #ffffff;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 24px;

    font-weight: 600;

    letter-spacing: 1px;

    border:
        2px solid
        rgba(255,255,255,.35);

    box-shadow:
        0 5px 14px
        rgba(77,66,43,.25),

        inset 0 0 0 4px
        rgba(255,255,255,.10);

    transition:
        opacity .3s ease,
        transform .3s ease;
}


.seal-amp {

    font-family:
        "Allura",
        cursive;

    font-size: 20px;

    font-weight: 400;

    margin:
        0 2px;
}



/* ==========================================
   ENVELOPE OPEN ANIMATION
========================================== */

.envelope-wrapper.open
.envelope-flap {

    transform:
        rotateX(180deg);

    z-index: 0;
}


.envelope-wrapper.open
.seal {

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(.6);
}


.envelope-wrapper.open
.letter-preview {

    transform:
        translateY(-42%);
}


.click-text {

    margin-top: 35px;

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 4px;

    color: #788797;

    animation:
        pulse 2s infinite;
}


@keyframes pulse {

    0%,
    100% {

        opacity: .5;
    }

    50% {

        opacity: 1;
    }
}



/* ==========================================
   INVITATION SCREEN
========================================== */

#invitation-screen {

    min-height: 100vh;

    width: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    padding:
        35px 20px;

    opacity: 0;

    transform:
        translateY(25px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}


#invitation-screen.show {

    opacity: 1;

    transform:
        translateY(0);
}



/* ==========================================
   INVITATION CARD
========================================== */

.invitation {

    position: relative;

    width:
        min(
            680px,
            calc((100vh - 70px) * 2 / 3),
            calc(100vw - 30px)
        );

    aspect-ratio:
        2 / 3;

    background-image:
        url("wedding-bg.png");

    background-size:
        cover;

    background-position:
        center;

    background-repeat:
        no-repeat;

    overflow:
        hidden;

    box-shadow:
        0 18px 60px
        rgba(61,77,95,.22);
}



/* ==========================================
   INVITATION CONTENT AREA
========================================== */

.invitation-content {

    position: absolute;

    top: 35%;

    left: 25%;
    right: 7%;

    bottom: 7%;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    color: #565e68;
}



/* ==========================================
   SAVE THE DATE
========================================== */

.save {

    margin: 0;

    font-family:
        "Allura",
        cursive;

    font-size:
        clamp(46px, 7vw, 80px);

    font-weight: 400;

    line-height: .72;

    color:
        #596779;
}


.the {

    margin-top: 14px;

    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(8px, 1.2vw, 13px);

    font-weight: 500;

    letter-spacing: 7px;

    color:
        #9c804b;
}


.date-script {

    font-family:
        "Allura",
        cursive;

    font-size:
        clamp(52px, 8vw, 90px);

    line-height: .82;

    margin-bottom: 27px;

    color:
        #596779;
}



/* ==========================================
   COUPLE NAMES
========================================== */

.couple {

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(19px, 2.7vw, 30px);

    font-weight: 600;

    letter-spacing: 4px;

    text-transform: uppercase;

    color:
        #505c6b;

    margin-bottom: 24px;

    white-space: nowrap;
}



/* ==========================================
   WEDDING DATE
========================================== */

.wedding-date {

    display: flex;

    justify-content: center;
    align-items: center;

    margin-bottom: 21px;
}


.day {

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(40px, 5vw, 60px);

    font-weight: 500;

    line-height: 1;

    color:
        #566476;

    padding-right: 15px;

    border-right:
        1px solid
        #c6a55d;
}


.date-info {

    padding-left: 15px;

    text-align: left;

    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(9px, 1.35vw, 14px);

    font-weight: 500;

    letter-spacing: 2.5px;

    line-height: 1.65;

    text-transform:
        uppercase;

    color:
        #596574;
}



/* ==========================================
   VENUE
========================================== */

.venue {

    margin-top: 2px;

    text-align: center;

    color:
        #566476;
}



/* WEDDING VENUE */

.venue-name {

    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(10px, 1.5vw, 16px);

    font-style:
        normal;

    font-weight:
        500;

    letter-spacing:
        2.5px;

    text-transform:
        uppercase;

    color:
        #566476;

    margin-bottom:
        5px;
}



/* Narail, Bangladesh */

.venue-location {

    margin-top: 0;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(13px, 2vw, 20px);

    

    font-weight:
        1000;

    line-height:
        1.15;

    letter-spacing:
        1.5px;

    text-transform:
        uppercase;

    color:
        #566476;

    white-space:
        nowrap;
}



/* ==========================================
   FINAL MESSAGE
========================================== */

.rsvp {

    margin-top:
        13px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(8px, 1vw, 12px);

    font-weight:
        500;

    letter-spacing:
        1.1px;

    text-transform:
        none;

    color:
        #667180;

    white-space:
        nowrap;

    line-height:
        1.2;
}



/* ==========================================
   MOBILE
========================================== */

@media (max-width: 600px) {


    #invitation-screen {

        padding:
            12px;
    }


    .invitation {

        width:
            min(
                calc(100vw - 20px),
                calc((100vh - 24px) * 2 / 3)
            );
    }


    .invitation-content {

        top: 34%;

        left: 25%;

        right: 5%;

        bottom: 6%;
    }



    /* SAVE */

    .save {

        font-size:
            clamp(
                38px,
                12vw,
                60px
            );
    }



    /* THE */

    .the {

        font-size:
            clamp(
                7px,
                2vw,
                10px
            );

        letter-spacing:
            3px;

        margin-top:
            9px;
    }



    /* DATE SCRIPT */

    .date-script {

        font-size:
            clamp(
                43px,
                14vw,
                70px
            );

        margin-bottom:
            18px;
    }



    /* NAMES */

    .couple {

        font-size:
            clamp(
                14px,
                4vw,
                20px
            );

        letter-spacing:
            2px;

        margin-bottom:
            17px;
    }



    /* DAY */

    .day {

        font-size:
            clamp(
                31px,
                9vw,
                45px
            );

        padding-right:
            10px;
    }



    /* DATE DETAILS */

    .date-info {

        font-size:
            clamp(
                8px,
                2.5vw,
                12px
            );

        padding-left:
            10px;

        letter-spacing:
            1.5px;
    }



    .wedding-date {

        margin-bottom:
            16px;
    }



    /* VENUE TITLE */

    .venue-name {

        font-size:
            clamp(
                8px,
                2.5vw,
                12px
            );

        letter-spacing:
            1.2px;

        margin-bottom:
            2px;
    }



    /* LOCATION */

    .venue-location {

        font-size:
            clamp(
                11px,
                3.4vw,
                16px
            );

        letter-spacing:
            .5px;

        font-style:
            italic;
    }



    /* FINAL MESSAGE */

    .rsvp {

        margin-top:
            8px;

        font-size:
            clamp(
                4px,
                1.15vw,
                6px
            );

        letter-spacing:
            .45px;

        white-space:
            nowrap;
            
    }



    /* SEAL */

    .seal {

        width:
            58px;

        height:
            58px;

        font-size:
            20px;
    }


    .seal-amp {

        font-size:
            17px;
    }



    /* ENVELOPE TITLE */

    .envelope-title {

        font-size:
            18px;

        letter-spacing:
            3px;
    }

}



/* ==========================================
   VERY SMALL MOBILE DEVICES
========================================== */

@media (max-width: 400px) {


    .couple {

        letter-spacing:
            1.5px;
    }


    .venue-name {

        font-size:
            8px;
    }


    .venue-location {

        font-size:
            11px;

        letter-spacing:
            .3px;
    }


    .rsvp {

        font-size:
            4px;

        letter-spacing:
            .25px;
    }

}



/* ==========================================
   SHORT SCREENS
========================================== */

@media (max-height: 650px) {

    #invitation-screen {

        align-items:
            flex-start;
    }

}


</style>

</head>



<body>


<!-- ==========================================
     ENVELOPE
========================================== -->

<section id="envelope-screen">


    <div class="envelope-title">

        YOU'RE INVITED

    </div>



    <div
        class="envelope-wrapper"
        id="envelope"
        onclick="openInvitation()"
        role="button"
        tabindex="0"
        aria-label="Open wedding invitation"
    >


        <div class="envelope">


            <div class="envelope-back"></div>


            <div class="letter-preview">

                H &amp; T

            </div>


            <div class="envelope-left"></div>


            <div class="envelope-right"></div>


            <div class="envelope-bottom"></div>


            <div class="envelope-flap"></div>



            <!-- WAX SEAL -->

            <div class="seal">

                H

                <span class="seal-amp">
                    &amp;
                </span>

                T

            </div>


        </div>


    </div>



    <div class="click-text">

        Click to open

    </div>


</section>





<!-- ==========================================
     WEDDING INVITATION
========================================== -->

<section id="invitation-screen">


    <main class="invitation">


        <div class="invitation-content">



            <!-- SAVE THE DATE -->

            <h1 class="save">

                Save

            </h1>


            <div class="the">

                THE

            </div>


            <div class="date-script">

                Date

            </div>





            <!-- COUPLE -->

            <div class="couple">

                HASAN &amp; TONIMA

            </div>





            <!-- DATE -->

            <div class="wedding-date">


                <div class="day">

                    16

                </div>


                <div class="date-info">


                    <div>

                        FRIDAY

                    </div>


                    <div>

                        OCTOBER, 2026

                    </div>


                </div>


            </div>





            <!-- VENUE -->

            <div class="venue">


                <div class="venue-name">

                    WEDDING VENUE

                </div>


                <div class="venue-location">

                    NARAIL, BANGLADESH

                </div>


            </div>





            <!-- FINAL MESSAGE -->

            <div class="rsvp">

                Your presence will make our special day even more beautiful.

            </div>


        </div>


    </main>


</section>





<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script>


function openInvitation() {


    const envelope =
        document.getElementById("envelope");


    const envelopeScreen =
        document.getElementById("envelope-screen");


    const invitationScreen =
        document.getElementById("invitation-screen");



    /* Open envelope */

    envelope.classList.add("open");



    /* Reveal invitation */

    setTimeout(() => {


        envelopeScreen.classList.add("hide");


        invitationScreen.classList.add("show");


    }, 1100);


}



/* ==========================================
   KEYBOARD ACCESSIBILITY
========================================== */

document
    .getElementById("envelope")
    .addEventListener(
        "keydown",
        function(event) {


            if (
                event.key === "Enter" ||
                event.key === " "
            ) {


                event.preventDefault();


                openInvitation();


            }


        }
    );


</script>
