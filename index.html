<link rel="preconnect"

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet">


<style>

/* ==========================================
   GLOBAL
========================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {
    font-family: "Montserrat", sans-serif;

    background:
        radial-gradient(
            circle at top,
            #f7f9fc 0%,
            #e8eef5 45%,
            #d7e1ed 100%
        );

    color: #555d68;
}


/* ==========================================
   ENVELOPE SCREEN
========================================== */

#envelope-screen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 20px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at top,
            #fafcff 0%,
            #edf3f8 45%,
            #d8e3ed 100%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}


#envelope-screen.hide {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


.envelope-title {

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(17px, 2.5vmin, 26px);

    font-weight: 500;

    letter-spacing:
        clamp(2px, .5vmin, 4px);

    text-align: center;

    color: #667487;

    margin-bottom:
        clamp(20px, 4vh, 35px);
}


/* ==========================================
   ENVELOPE
========================================== */

.envelope-wrapper {

    /*
       Envelope also respects BOTH
       screen width and screen height.
    */

    width:
        min(
            500px,
            88vw,
            60vh
        );

    aspect-ratio:
        1.55 / 1;

    position: relative;

    cursor: pointer;

    flex-shrink: 0;

    filter:
        drop-shadow(
            0 20px 25px
            rgba(62,79,100,.20)
        );

    transition:
        transform .35s ease;
}


.envelope-wrapper:hover {

    transform:
        translateY(-4px);
}


.envelope {

    position: absolute;

    inset: 0;

    perspective: 1200px;
}


.envelope-back {

    position: absolute;

    inset: 0;

    border-radius: 5px;

    background:
        linear-gradient(
            135deg,
            #d9e5f0,
            #aec4d9
        );
}


/* LETTER */

.letter-preview {

    position: absolute;

    width: 86%;
    height: 82%;

    left: 7%;
    top: 8%;

    background: #ffffff;

    border-radius: 4px;

    display: flex;

    justify-content: center;
    align-items: center;

    font-family:
        "Allura",
        cursive;

    font-size:
        clamp(32px, 8vmin, 58px);

    color: #647487;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.12);

    transition:
        transform .8s ease .35s;
}


/* ENVELOPE FOLDS */

.envelope-left {

    position: absolute;

    inset: 0;

    clip-path:
        polygon(
            0 0,
            52% 50%,
            0 100%
        );

    background: #c6d7e5;
}


.envelope-right {

    position: absolute;

    inset: 0;

    clip-path:
        polygon(
            100% 0,
            48% 50%,
            100% 100%
        );

    background: #b7cddd;
}


.envelope-bottom {

    position: absolute;

    inset: 0;

    clip-path:
        polygon(
            0 100%,
            50% 45%,
            100% 100%
        );

    background:
        linear-gradient(
            to top,
            #d6e2ec,
            #bfd1df
        );
}


.envelope-flap {

    position: absolute;

    width: 100%;
    height: 56%;

    top: 0;
    left: 0;

    background:
        linear-gradient(
            145deg,
            #dfe9f2,
            #b5cadd
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin: top;

    transition:
        transform .8s ease;

    z-index: 10;
}


/* ==========================================
   WAX SEAL
========================================== */

.seal {

    position: absolute;

    width: 76px;
    height: 76px;

    left: 50%;
    top: 47%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    z-index: 20;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f4e3b2,
            #c9a85d 55%,
            #9d7d3d
        );

    color: #ffffff;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 24px;

    font-weight: 600;

    letter-spacing: 1px;

    border:
        2px solid
        rgba(255,255,255,.35);

    box-shadow:
        0 5px 14px
        rgba(77,66,43,.25),

        inset 0 0 0 4px
        rgba(255,255,255,.10);

    transition:
        opacity .3s ease,
        transform .3s ease;
}


.seal-amp {

    font-family:
        "Allura",
        cursive;

    font-size: 20px;

    font-weight: 400;

    margin: 0 2px;
}


/* ENVELOPE OPEN */

.envelope-wrapper.open
.envelope-flap {

    transform:
        rotateX(180deg);

    z-index: 0;
}


.envelope-wrapper.open
.seal {

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(.6);
}


.envelope-wrapper.open
.letter-preview {

    transform:
        translateY(-42%);
}


.click-text {

    margin-top:
        clamp(18px, 4vh, 35px);

    font-size:
        clamp(8px, 1.4vmin, 12px);

    text-transform: uppercase;

    letter-spacing:
        clamp(2px, .5vmin, 4px);

    color: #788797;

    animation:
        pulse 2s infinite;
}


@keyframes pulse {

    0%,
    100% {
        opacity: .5;
    }

    50% {
        opacity: 1;
    }
}


/* ==========================================
   INVITATION SCREEN
========================================== */

#invitation-screen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100dvh;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 10px;

    overflow: hidden;

    opacity: 0;

    transform:
        translateY(20px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}


#invitation-screen.show {

    opacity: 1;

    transform:
        translateY(0);
}


/* ==========================================
   RESPONSIVE CARD WRAPPER

   Card ratio = 2:3.

   Width is restricted by:
   1. available screen width
   2. available screen height

   This is what prevents scrolling.
========================================== */

.invitation-wrapper {

    /*
       Maximum desktop width = 680px.

       For short screens:
       width = available height × 2/3.
    */

    --available-width:
        calc(100vw - 20px);

    --available-height:
        calc(100dvh - 20px);

    --fit-width:
        calc(
            var(--available-height)
            * 2 / 3
        );

    --card-width:
        min(
            680px,
            var(--available-width),
            var(--fit-width)
        );

    width:
        var(--card-width);

    height:
        calc(
            var(--card-width)
            * 3 / 2
        );

    position: relative;

    flex-shrink: 0;
}


/* ==========================================
   INVITATION

   Fixed design canvas = 680 × 1020.
   Everything inside scales together.
========================================== */

.invitation {

    position: absolute;

    top: 0;
    left: 0;

    width: 680px;
    height: 1020px;

    transform-origin:
        top left;

    transform:
        scale(
            calc(
                var(--card-width)
                / 680px
            )
        );

    background-image:
        url("./wedding-bg.png");

    background-size:
        cover;

    background-position:
        center;

    background-repeat:
        no-repeat;

    overflow: hidden;

    box-shadow:
        0 14px 45px
        rgba(61,77,95,.22);
}


/* ==========================================
   CONTENT
========================================== */

.invitation-content {

    position: absolute;

    top: 34%;

    left: 25%;
    right: 6%;

    bottom: 5%;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    color: #565e68;
}


/* ==========================================
   SAVE THE DATE
========================================== */

.save {

    margin: 0;

    font-family:
        "Allura",
        cursive;

    font-size: 78px;

    font-weight: 400;

    line-height: .72;

    color: #596779;
}


.the {

    margin-top: 13px;

    font-family:
        "Cinzel",
        serif;

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 6px;

    color: #9c804b;
}


.date-script {

    font-family:
        "Allura",
        cursive;

    font-size: 88px;

    font-weight: 400;

    line-height: .82;

    margin-bottom: 27px;

    color: #596779;
}


/* ==========================================
   COUPLE
========================================== */

.couple {

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 29px;

    font-weight: 600;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: #505c6b;

    margin-bottom: 24px;

    white-space: nowrap;
}


/* ==========================================
   DATE
========================================== */

.wedding-date {

    display: flex;

    justify-content: center;
    align-items: center;

    margin-bottom: 21px;
}


.day {

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 58px;

    font-weight: 500;

    line-height: 1;

    color: #566476;

    padding-right: 15px;

    border-right:
        1px solid
        #c6a55d;
}


.date-info {

    padding-left: 15px;

    text-align: left;

    font-family:
        "Cinzel",
        serif;

    font-size: 14px;

    font-weight: 500;

    letter-spacing: 2.2px;

    line-height: 1.65;

    text-transform: uppercase;

    color: #596574;

    white-space: nowrap;
}


/* ==========================================
   VENUE
========================================== */

.venue {

    margin-top: 2px;

    text-align: center;

    color: #566476;
}


.venue-name {

    font-family:
        "Cinzel",
        serif;

    font-size: 15px;

    font-weight: 500;

    letter-spacing: 2.3px;

    text-transform: uppercase;

    color: #566476;

    margin-bottom: 5px;
}


/* ==========================================
   LOCATION
========================================== */

.venue-location {

    margin: 0;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 20px;

    font-style: italic;

    font-weight: 600;

    line-height: 1.15;

    letter-spacing: 1px;

    text-transform: uppercase;

    color: #566476;

    white-space: nowrap;
}


/* ==========================================
   RSVP
========================================== */

.rsvp {

    margin-top: 13px;

    width: 100%;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 11px;

    font-weight: 500;

    letter-spacing: .65px;

    text-transform: none;

    color: #667180;

    line-height: 1.2;

    white-space: nowrap;

    text-align: center;
}


/* ==========================================
   MOBILE LANDSCAPE / VERY SHORT SCREENS
========================================== */

@media (max-height: 500px) {

    #invitation-screen {

        padding: 5px;
    }


    .invitation-wrapper {

        --available-width:
            calc(100vw - 10px);

        --available-height:
            calc(100dvh - 10px);
    }


    #envelope-screen {

        padding: 8px;
    }


    .envelope-title {

        margin-bottom: 10px;
    }


    .click-text {

        margin-top: 10px;
    }

}


/* ==========================================
   MOBILE ENVELOPE
========================================== */

@media (max-width: 600px) {

    .envelope-wrapper {

        width:
            min(
                90vw,
                58vh
            );
    }


    .seal {

        /*
           Scaling only the envelope UI.
           Invitation typography remains
           completely unchanged.
        */

        width:
            clamp(52px, 15vw, 68px);

        height:
            clamp(52px, 15vw, 68px);

        font-size:
            clamp(17px, 5vw, 22px);
    }


    .seal-amp {

        font-size:
            clamp(14px, 4vw, 18px);
    }
.rsvp {
        font-size: 13px;
        letter-spacing: 0.4px;
    }

}

</style>

</head>


<body>


<!-- ==========================================
     ENVELOPE
========================================== -->

<section id="envelope-screen">


    <div class="envelope-title">

        YOU'RE INVITED

    </div>


    <div
        class="envelope-wrapper"
        id="envelope"
        onclick="openInvitation()"
        role="button"
        tabindex="0"
        aria-label="Open wedding invitation"
    >


        <div class="envelope">


            <div class="envelope-back"></div>


            <div class="letter-preview">

                H &amp; T

            </div>


            <div class="envelope-left"></div>

            <div class="envelope-right"></div>

            <div class="envelope-bottom"></div>

            <div class="envelope-flap"></div>


            <div class="seal">

                H

                <span class="seal-amp">
                    &amp;
                </span>

                T

            </div>


        </div>


    </div>


    <div class="click-text">

        Click to open

    </div>


</section>



<!-- ==========================================
     INVITATION
========================================== -->

<section id="invitation-screen">


    <div class="invitation-wrapper">


        <main class="invitation">


            <div class="invitation-content">


                <h1 class="save">
                    Save
                </h1>


                <div class="the">
                    THE
                </div>


                <div class="date-script">
                    Date
                </div>


                <div class="couple">

                    HASAN &amp; TONIMA

                </div>


                <div class="wedding-date">


                    <div class="day">

                        16

                    </div>


                    <div class="date-info">


                        <div>
                            FRIDAY
                        </div>


                        <div>
                            OCTOBER, 2026
                        </div>


                    </div>


                </div>


                <div class="venue">


                    <div class="venue-name">

                        WEDDING VENUE

                    </div>


                    <div class="venue-location">

                        NARAIL, BANGLADESH

                    </div>


                </div>


                <div class="rsvp">

                    Your presence will make our special day even more beautiful.

                </div>


            </div>


        </main>


    </div>


</section>



<script>

/* ==========================================
   OPEN INVITATION
========================================== */

function openInvitation() {


    const envelope =
        document.getElementById("envelope");


    const envelopeScreen =
        document.getElementById("envelope-screen");


    const invitationScreen =
        document.getElementById("invitation-screen");


    envelope.classList.add("open");


    setTimeout(() => {


        envelopeScreen.classList.add("hide");


        invitationScreen.classList.add("show");


    }, 1100);

}


/* ==========================================
   KEYBOARD SUPPORT
========================================== */

document
    .getElementById("envelope")
    .addEventListener(
        "keydown",
        function(event) {


            if (
                event.key === "Enter" ||
                event.key === " "
            ) {


                event.preventDefault();


                openInvitation();

            }

        }
    );

</script>


</body>
