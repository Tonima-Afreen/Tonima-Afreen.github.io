<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#e9e9e9;padding:20px}.invitation{position:relative;width:min(100%,700px);aspect-ratio:2/3;background-image:url("wedding-bg.png");background-size:cover;background-position:center;background-repeat:no-repeat;overflow:hidden;box-shadow:0 15px 50px rgba(0,0,0,.18)}.invitation-content{position:absolute;top:37%;left:27%;right:8%;bottom:5%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#555b65}.save{font-family:"Allura",cursive;font-size:clamp(55px,9vw,95px);font-weight:400;line-height:.72;margin:0}.the{font-family:"Montserrat",sans-serif;font-size:clamp(13px,2vw,19px);font-weight:400;letter-spacing:7px;margin:15px 0 0}.date-script{font-family:"Allura",cursive;font-size:clamp(65px,10vw,105px);font-weight:400;line-height:.75;margin-bottom:45px}.couple{font-family:"Cormorant Garamond",serif;font-size:clamp(23px,3.8vw,36px);font-weight:500;letter-spacing:7px;text-transform:uppercase;margin-bottom:30px}.wedding-date{display:flex;justify-content:center;align-items:center;margin-bottom:30px}.day{font-family:"Montserrat",sans-serif;font-size:clamp(48px,7vw,72px);font-weight:600;line-height:1;padding-right:18px;border-right:2px solid #60646b}.date-info{padding-left:18px;text-align:left;font-family:"Montserrat",sans-serif;font-size:clamp(14px,2.2vw,21px);font-weight:400;letter-spacing:5px;line-height:1.45;text-transform:uppercase}.venue{font-family:"Montserrat",sans-serif;font-size:clamp(13px,2vw,19px);font-weight:400;letter-spacing:4px;line-height:1.7;text-transform:uppercase}.rsvp{margin-top:10px;font-family:"Montserrat",sans-serif;font-size:clamp(13px,2vw,18px);letter-spacing:5px}@media(max-width:600px){body{padding:0;background:#fff}.invitation{width:100%;min-height:100vh;box-shadow:none}.invitation-content{top:35%;left:27%;right:5%;bottom:3%}.date-script{margin-bottom:30px}.couple{letter-spacing:4px;margin-bottom:22px}.date-info,.venue{letter-spacing:3px}}
</style>
</head>
<body>
<main class="invitation">
<section class="invitation-content">
<h1 class="save">Save</h1><div class="the">THE</div><div class="date-script">Date</div>
<div class="couple">HASAN &amp; TONIMA</div>
<div class="wedding-date"><div class="day">16</div><div class="date-info"><div>FRIDAY</div><div>OCTOBER, 2026</div><div></div></div></div>
<div class="venue"><div>WEDDING VENUE</div><div>NARAIL, BANGLADESH</div></div> 
<div class="rsvp">YOUR PRESENCE WILL MAKE OUR SPECIAL DAY EVEN MORE BEAUTIFUL.</div> 
</section>
</main>
</body>
</html>
